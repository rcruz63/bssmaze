AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Telnet Tales - despliegue de humo (Lambda, HTTP API, DynamoDB, S3, CloudFront)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Tags:
      project: telnet-tales

Resources:
  # Una sola tabla para guardados, contador diario y bloqueo de login (ADR 0009).
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      Tags:
        - {Key: project, Value: telnet-tales}

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      Tags:
        project: telnet-tales

  SmokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: smoke/
      Handler: handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      # Mínimo privilegio: solo PutItem y GetItem sobre esta tabla.
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt Table.Arn
        # --- BEDROCK (desactivado hasta la tarea 13.1) ---------------------
        # Los perfiles de inferencia `us.*` exigen permiso sobre el perfil y
        # sobre los modelos base de cada región donde enruta.
        # - Statement:
        #     - Effect: Allow
        #       Action: [bedrock:InvokeModel]
        #       Resource:
        #         - !Sub arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.MODEL_ID
        #         - arn:aws:bedrock:*::foundation-model/MODEL_ID
        # -------------------------------------------------------------------
      Events:
        Command:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/command
            Method: POST

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - {Key: project, Value: telnet-tales}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - {Key: project, Value: telnet-tales}
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
          - Id: api
            DomainName: !Sub ${Api}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          # Política gestionada CachingOptimized.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # CachingDisabled y AllViewerExceptHostHeader (API Gateway necesita su propio Host).
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # Solo esta distribución puede leer el bucket.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  CloudFrontUrl:
    Value: !Sub https://${Distribution.DomainName}
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref SiteBucket
