[project]
name = "telnet-tales"
version = "0.1.0"
description = "AI-powered interactive fiction in the style of 1980s BBS door games."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telnet_tales"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "C90", "SIM", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.ruff.lint.pylint]
max-statements = 25

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = ["src", "scripts"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
